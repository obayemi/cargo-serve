[package]
name = "cargo-serve"
version = "0.1.0"
edition = "2024"

[dependencies]
cargo_metadata = "0.23.1"
clap = { version = "4.6.0", features = ["derive"] }
ignore = "0.4.25"
libc = "0.2.183"
notify = { version = "8.2.0", features = ["macos_kqueue"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.50.0", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
